<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practical Quiz 2 - Tropical Summer Hut</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<script>
/* =====================================================================
   Procedural textures (drawn with code - no image files, no 3D models)
   ===================================================================== */
function makeCanvas(type) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const rnd = (a, b) => a + Math.random() * (b - a);

  if (type === 'wood') {
    g.fillStyle = '#8a5a33'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 8; i++) {
      g.fillStyle = `hsl(28, 45%, ${rnd(30, 40)}%)`;
      g.fillRect(i * 32, 0, 32, 256);
      for (let k = 0; k < 25; k++) {
        g.strokeStyle = `rgba(60,30,10,${rnd(0.08, 0.25)})`;
        g.lineWidth = rnd(0.5, 1.5);
        const x = i * 32 + rnd(2, 30);
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x + rnd(-3, 3), 256); g.stroke();
      }
      g.fillStyle = 'rgba(30,15,5,0.7)'; g.fillRect(i * 32, 0, 2, 256);
    }
  } else if (type === 'thatch') {
    g.fillStyle = '#b8923f'; g.fillRect(0, 0, 256, 256);
    const pal = ['#d9b25c', '#a07a2c', '#c9a14d', '#8d6a24', '#e2c273'];
    for (let i = 0; i < 1400; i++) {
      g.strokeStyle = pal[(Math.random() * pal.length) | 0];
      g.lineWidth = rnd(1, 2.5);
      const x = rnd(0, 256), y = rnd(0, 256), l = rnd(25, 60);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + rnd(-6, 6), y + l); g.stroke();
    }
  } else if (type === 'sand') {
    g.fillStyle = '#ecd9a0'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 5000; i++) {
      g.fillStyle = `hsl(${rnd(38, 48)}, ${rnd(40, 60)}%, ${rnd(65, 82)}%)`;
      g.fillRect(rnd(0, 256), rnd(0, 256), rnd(1, 2.5), rnd(1, 2.5));
    }
  } else if (type === 'water') {
    g.fillStyle = '#1aa6c8'; g.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 90; i++) {
      g.strokeStyle = `rgba(255,255,255,${rnd(0.05, 0.22)})`;
      g.lineWidth = rnd(1, 3);
      const x = rnd(0, 256), y = rnd(0, 256), l = rnd(20, 60);
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + l / 2, y + rnd(-6, 6), x + l, y);
      g.stroke();
    }
  }
  return c;
}

function fixColorSpace(t) {
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
  else t.encoding = THREE.sRGBEncoding;
}

/* apply a texture to an entity's mesh as soon as the mesh exists */
function applyMap(el, tex) {
  const apply = () => {
    const m = el.getObject3D('mesh');
    if (m && m.material) { m.material.map = tex; m.material.needsUpdate = true; return true; }
    return false;
  };
  if (!apply()) {
    el.addEventListener('object3dset', e => { if (e.detail.type === 'mesh') apply(); });
  }
}

AFRAME.registerComponent('tex', {
  schema: { type: { default: 'wood' }, repeat: { type: 'vec2', default: { x: 1, y: 1 } } },
  init: function () {
    const t = new THREE.CanvasTexture(makeCanvas(this.data.type));
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(this.data.repeat.x, this.data.repeat.y);
    fixColorSpace(t);
    applyMap(this.el, t);
  }
});

/* slowly scrolls the ocean texture so the water looks alive */
AFRAME.registerComponent('flow', {
  tick: function (t, dt) {
    const m = this.el.getObject3D('mesh');
    if (m && m.material && m.material.map) {
      m.material.map.offset.x += dt * 0.00002;
      m.material.map.offset.y += dt * 0.000012;
    }
  }
});

/* gradient sky that can switch between day and night */
AFRAME.registerComponent('skydome', {
  init: function () {
    const c = document.createElement('canvas');
    c.width = 4; c.height = 512;
    const g = c.getContext('2d');
    const t = new THREE.CanvasTexture(c);
    fixColorSpace(t);
    const draw = (night) => {
      const gr = g.createLinearGradient(0, 0, 0, 512);
      if (night) {
        gr.addColorStop(0, '#04081f');
        gr.addColorStop(0.42, '#16224d');
        gr.addColorStop(0.5, '#4a3a6e');
        gr.addColorStop(1, '#4a3a6e');
      } else {
        gr.addColorStop(0, '#2a6fd6');
        gr.addColorStop(0.42, '#8cc8f5');
        gr.addColorStop(0.5, '#fff1c9');
        gr.addColorStop(1, '#fff1c9');
      }
      g.fillStyle = gr; g.fillRect(0, 0, 4, 512);
      t.needsUpdate = true;
    };
    window.SKY = { draw: draw };
    draw(false);
    applyMap(this.el, t);
  }
});

/* stars for night mode */
AFRAME.registerComponent('stars', {
  init: function () {
    let h = '';
    for (let i = 0; i < 160; i++) {
      const th = Math.random() * Math.PI * 2;
      const ph = Math.random() * 1.2 + 0.1;   // upper part of the sky
      const R = 160;
      const x = R * Math.cos(ph) * Math.cos(th), y = R * Math.sin(ph), z = R * Math.cos(ph) * Math.sin(th);
      h += `<a-sphere position="${x.toFixed(1)} ${y.toFixed(1)} ${z.toFixed(1)}" radius="${(0.25 + Math.random() * 0.35).toFixed(2)}" material="shader: flat; color: #ffffff; fog: false"></a-sphere>`;
    }
    this.el.insertAdjacentHTML('beforeend', h);
  }
});

/* every mesh inside casts + receives shadows */
AFRAME.registerComponent('shadow-all', {
  init: function () {
    setTimeout(() => {
      this.el.object3D.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    }, 800);
  }
});

/* =====================================================================
   The cabana: posts, railings, curtains, twinkling string lights
   (deck top is at y = 0.4 inside the hut group)
   ===================================================================== */
AFRAME.registerComponent('hut', {
  init: function () {
    const wood = '#7a4b25';
    let h = '';

    // 8 chunky posts with rope bands and caps (doorway gap at the front)
    for (let k = 0; k < 8; k++) {
      const a = (22.5 + 45 * k) * Math.PI / 180;
      const x = (3.8 * Math.sin(a)).toFixed(3), z = (3.8 * Math.cos(a)).toFixed(3);
      h += `<a-cylinder position="${x} 1.9 ${z}" radius="0.12" height="3" color="${wood}"></a-cylinder>
            <a-box position="${x} 0.5 ${z}" width="0.35" height="0.2" depth="0.35" color="#5a3416"></a-box>
            <a-torus position="${x} 1.0 ${z}" rotation="90 0 0" radius="0.125" radius-tubular="0.025" color="#e0c48a"></a-torus>
            <a-torus position="${x} 1.12 ${z}" rotation="90 0 0" radius="0.125" radius-tubular="0.025" color="#e0c48a"></a-torus>
            <a-sphere position="${x} 3.45 ${z}" radius="0.14" color="#5a3416"></a-sphere>`;
    }

    // railings + flowing curtains between posts (front doorway left open)
    const len = 2 * 3.8 * Math.sin(22.5 * Math.PI / 180);
    const rr = 3.8 * Math.cos(22.5 * Math.PI / 180);
    const curtainCols = ['#ffffff', '#ffd1dc', '#ffffff', '#ffe3a8', '#ffffff'];
    for (let k = 0; k < 7; k++) {
      const m = 45 + 45 * k;
      const mr = m * Math.PI / 180;
      const x = (rr * Math.sin(mr)).toFixed(3), z = (rr * Math.cos(mr)).toFixed(3);
      h += `<a-box position="${x} 1.3 ${z}" rotation="0 ${m} 0" width="${len.toFixed(2)}" height="0.08" depth="0.08" color="${wood}"></a-box>
            <a-box position="${x} 0.85 ${z}" rotation="0 ${m} 0" width="${len.toFixed(2)}" height="0.06" depth="0.06" color="${wood}"></a-box>`;
      if (k >= 1 && k <= 5) {
        h += `<a-plane position="${x} 2.5 ${z}" rotation="0 ${m} 0" width="${(len * 0.95).toFixed(2)}" height="1.6"
                material="side: double; transparent: true; opacity: 0.55; color: ${curtainCols[k - 1]}"></a-plane>`;
      }
    }

    // twinkling string lights around the eaves
    const cols = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#ff924c', '#c77dff'];
    h += `<a-torus position="0 3.1 0" rotation="90 0 0" radius="5.72" radius-tubular="0.015" segments-tubular="72" color="#222"></a-torus>`;
    for (let i = 0; i < 48; i++) {
      const a = i * 7.5 * Math.PI / 180;
      const dur = 600 + Math.floor(Math.random() * 1200);
      h += `<a-sphere position="${(5.72 * Math.sin(a)).toFixed(3)} 3.02 ${(5.72 * Math.cos(a)).toFixed(3)}" radius="0.08"
              material="shader: flat; color: ${cols[i % cols.length]}"
              animation="property: scale; to: 1.6 1.6 1.6; dir: alternate; dur: ${dur}; loop: true; easing: easeInOutSine"></a-sphere>`;
    }
    this.el.insertAdjacentHTML('beforeend', h);
  }
});

/* =====================================================================
   Chair  (boxes + cylinders)
   ===================================================================== */
AFRAME.registerComponent('chair', {
  schema: { cushion: { default: '#ff7a59' } },
  init: function () {
    const wood = '#a0693a';
    let h = '';
    [[-.22, -.22], [.22, -.22], [-.22, .22], [.22, .22]].forEach(p => {
      h += `<a-cylinder position="${p[0]} 0.225 ${p[1]}" radius="0.025" height="0.45" color="${wood}"></a-cylinder>`;
    });
    h += `<a-box position="0 0.45 0" width="0.52" height="0.05" depth="0.52" color="${wood}"></a-box>`;
    h += `<a-box position="0 0.5 0" width="0.46" height="0.05" depth="0.46" color="${this.data.cushion}"></a-box>`;
    h += `<a-cylinder position="-0.22 0.75 0.22" radius="0.025" height="0.6" color="${wood}"></a-cylinder>`;
    h += `<a-cylinder position="0.22 0.75 0.22" radius="0.025" height="0.6" color="${wood}"></a-cylinder>`;
    [0.92, 0.80, 0.68].forEach(y => {
      h += `<a-box position="0 ${y} 0.22" width="0.46" height="0.07" depth="0.03" color="${wood}"></a-box>`;
    });
    this.el.insertAdjacentHTML('beforeend', h);
  }
});

/* =====================================================================
   Cup with saucer, handle and a hot drink inside
   ===================================================================== */
AFRAME.registerComponent('cup', {
  schema: { color: { default: '#ffffff' }, band: { default: '#2a6fdb' } },
  init: function () {
    const d = this.data;
    const h = `
      <a-cylinder position="0 0.006 0" radius="0.1" height="0.012" color="#f4f4f4"></a-cylinder>
      <a-cylinder position="0 0.052 0" radius-top="0.06" radius-bottom="0.042" height="0.08" open-ended="true" material="side:double; color:${d.color}"></a-cylinder>
      <a-cylinder position="0 0.07 0" radius-top="0.0575" radius-bottom="0.0535" height="0.015" open-ended="true" material="side:double; color:${d.band}"></a-cylinder>
      <a-cylinder position="0 0.014 0" radius="0.042" height="0.004" color="${d.color}"></a-cylinder>
      <a-circle position="0 0.083 0" rotation="-90 0 0" radius="0.056" color="#5b3a22"></a-circle>
      <a-torus position="0.067 0.055 0" radius="0.026" radius-tubular="0.007" color="${d.color}"></a-torus>`;
    this.el.insertAdjacentHTML('beforeend', h);
  }
});

/* =====================================================================
   Palm tree
   ===================================================================== */
AFRAME.registerComponent('palm', {
  init: function () {
    let h = `<a-cylinder position="-0.2 3 0" rotation="0 0 4" radius-top="0.14" radius-bottom="0.24" height="6" color="#8b6a43"></a-cylinder>`;
    for (let i = 0; i < 7; i++) {
      const a = i * (360 / 7);
      const col = i % 2 ? '#2f8f3a' : '#3aa347';
      h += `<a-entity position="-0.25 6 0" rotation="0 ${a} 0"><a-entity rotation="0 0 -22">
              <a-sphere position="1.3 0 0" radius="1" scale="1.3 0.04 0.3" color="${col}" material="side:double"></a-sphere>
            </a-entity></a-entity>`;
    }
    h += `<a-sphere position="-0.1 5.8 0.15" radius="0.15" color="#5a3a1a"></a-sphere>
          <a-sphere position="-0.35 5.8 -0.1" radius="0.15" color="#5a3a1a"></a-sphere>`;
    this.el.insertAdjacentHTML('beforeend', h);
  }
});

/* =====================================================================
   Boardwalk, dock, tiki torches, bushes with flowers, rocks
   ===================================================================== */
AFRAME.registerComponent('garden', {
  init: function () {
    let s = 11;
    const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    let h = '';

    // boardwalk planks (runs from the hut out over the water)
    let n = 0;
    for (let z = 5.3; z <= 30; z += 0.55) {
      h += `<a-box position="0 0.07 ${z.toFixed(2)}" width="2.2" height="0.1" depth="0.5" color="${n % 2 ? '#9c6a3a' : '#8b5a2b'}"></a-box>`;
      n++;
    }
    // dock piles where the boardwalk is over the water
    for (let z = 19.5; z <= 30; z += 3) {
      [-1.0, 1.0].forEach(x => {
        h += `<a-cylinder position="${x} -0.85 ${z}" radius="0.1" height="2" color="#5a3a1a"></a-cylinder>`;
      });
    }
    // tiki torches with flickering flames
    [7, 11, 15, 19, 23].forEach(z => {
      [-1.5, 1.5].forEach(x => {
        const dur = 220 + Math.floor(r() * 200);
        h += `<a-entity position="${x} 0 ${z}">
          <a-cylinder position="0 0.8 0" radius="0.04" height="1.6" color="#6b4423"></a-cylinder>
          <a-cylinder position="0 1.62 0" radius="0.1" height="0.12" color="#3a2a1a"></a-cylinder>
          <a-cone position="0 1.85 0" radius-bottom="0.09" radius-top="0" height="0.32"
                  material="shader: flat; color: #ff9a1f"
                  animation="property: scale; to: 1 1.35 1; dir: alternate; dur: ${dur}; loop: true; easing: easeInOutSine"></a-cone>
        </a-entity>`;
      });
    });

    // tropical bushes with hibiscus flowers
    const fc = ['#ff4d6d', '#ff8fab', '#ffd23f', '#ff6b35', '#ffffff'];
    let placed = 0;
    while (placed < 18) {
      const rad = 6.8 + r() * 9.5, ang = r() * Math.PI * 2;
      const x = rad * Math.sin(ang), z = rad * Math.cos(ang);
      if (Math.abs(x) < 3 && z > 3) continue;       // keep boardwalk clear
      const sz = 0.6 + r() * 0.5;
      const gr = `hsl(${(105 + r() * 25) | 0}, 55%, ${(26 + r() * 12) | 0}%)`;
      h += `<a-sphere position="${x.toFixed(2)} ${(sz * 0.55).toFixed(2)} ${z.toFixed(2)}" radius="${sz.toFixed(2)}" scale="1 0.75 1" color="${gr}"></a-sphere>`;
      for (let f = 0; f < 4; f++) {
        const fa = r() * Math.PI * 2, fr = sz * (0.4 + r() * 0.5);
        h += `<a-sphere position="${(x + fr * Math.sin(fa)).toFixed(2)} ${(sz * 0.95 + r() * 0.1).toFixed(2)} ${(z + fr * Math.cos(fa)).toFixed(2)}" radius="0.1" color="${fc[(r() * fc.length) | 0]}"></a-sphere>`;
      }
      placed++;
    }

    // beach rocks
    for (let i = 0; i < 9; i++) {
      const rad = 15 + r() * 2.5, ang = r() * Math.PI * 2;
      const x = rad * Math.sin(ang), z = rad * Math.cos(ang);
      if (Math.abs(x) < 3 && z > 3) continue;
      const sz = 0.4 + r() * 0.6;
      h += `<a-sphere position="${x.toFixed(2)} ${(sz * 0.3).toFixed(2)} ${z.toFixed(2)}" radius="${sz.toFixed(2)}" scale="1 0.6 0.8" rotation="0 ${(r() * 360) | 0} 0" color="${r() > 0.5 ? '#7d7a73' : '#8e8a80'}"></a-sphere>`;
    }
    this.el.insertAdjacentHTML('beforeend', h);
  }
});
</script>

<style>
  body { margin: 0; }
  #hint { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; font: 14px sans-serif;
          color: #fff; background: rgba(0,0,0,.5); border-radius: 8px; z-index: 10; }
  #mode { position: fixed; right: 12px; top: 12px; padding: 10px 16px; font: 600 15px sans-serif;
          color: #fff; background: rgba(20,20,40,.7); border: 1px solid rgba(255,255,255,.4);
          border-radius: 999px; cursor: pointer; z-index: 10; }
  #mode:hover { background: rgba(60,60,110,.85); }
</style>
</head>

<body>
<div id="hint">Move: W A S D &nbsp;|&nbsp; Look: drag the mouse &nbsp;|&nbsp; N = day / night</div>
<button id="mode">&#127769; Night</button>

<a-scene shadow="type: pcfsoft" renderer="antialias: true" fog="type: linear; color: #cfe8ff; near: 50; far: 170">

  <!-- ================= SKY, SUN, MOON, STARS, CLOUDS ================= -->
  <a-sky material="shader: flat; fog: false; color: #ffffff" skydome></a-sky>

  <a-entity id="sunball">
    <a-sphere position="-45 50 -95" radius="6" material="shader: flat; color: #fff6b0; fog: false"></a-sphere>
    <a-sphere position="-45 50 -95" radius="10" material="shader: flat; color: #ffe9a0; opacity: 0.25; transparent: true; fog: false"></a-sphere>
  </a-entity>
  <a-entity id="moonball" visible="false">
    <a-sphere position="45 55 -95" radius="6" material="shader: flat; color: #f3f6ff; fog: false"></a-sphere>
    <a-sphere position="45 55 -95" radius="11" material="shader: flat; color: #9db4ff; opacity: 0.18; transparent: true; fog: false"></a-sphere>
  </a-entity>
  <a-entity id="stars" visible="false" stars></a-entity>

  <a-entity position="-30 34 -70" animation="property: position; to: 10 34 -70; dir: alternate; dur: 90000; loop: true; easing: linear">
    <a-sphere class="cloud" radius="4" scale="1 0.5 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
    <a-sphere class="cloud" position="4 0.5 0" radius="3.2" scale="1 0.5 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
    <a-sphere class="cloud" position="-4 -0.2 0" radius="3" scale="1 0.5 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
  </a-entity>
  <a-entity position="30 40 -85" animation="property: position; to: -5 40 -85; dir: alternate; dur: 120000; loop: true; easing: linear">
    <a-sphere class="cloud" radius="5" scale="1 0.5 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
    <a-sphere class="cloud" position="5 0.5 0" radius="3.5" scale="1 0.5 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
  </a-entity>
  <a-entity position="0 30 -100" animation="property: position; to: 40 30 -100; dir: alternate; dur: 100000; loop: true; easing: linear">
    <a-sphere class="cloud" radius="4" scale="1 0.45 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
    <a-sphere class="cloud" position="4 0 0" radius="3" scale="1 0.45 0.7" material="shader: flat; color: #fff; fog: false"></a-sphere>
  </a-entity>

  <!-- ================= LIGHTS ================= -->
  <a-entity id="amb" light="type: ambient; color: #ffffff; intensity: 0.65"></a-entity>
  <a-entity id="hemi" light="type: hemisphere; color: #bfe3ff; groundColor: #d8c48a; intensity: 0.3"></a-entity>
  <a-entity id="sun" position="-10 18 10"
            light="type: directional; color: #fff3d6; intensity: 0.9; castShadow: true;
                   shadowCameraLeft: -14; shadowCameraRight: 14; shadowCameraTop: 14; shadowCameraBottom: -14;
                   shadowCameraFar: 60; shadowMapWidth: 2048; shadowMapHeight: 2048"></a-entity>

  <!-- ================= OCEAN (animated) ================= -->
  <a-plane id="ocean" rotation="-90 0 0" width="600" height="600"
           material="color: #ffffff; opacity: 0.92; transparent: true; roughness: 0.15; metalness: 0.2"
           tex="type: water; repeat: 150 150" flow></a-plane>

  <!-- ================= EVERYTHING BELOW CASTS / RECEIVES SHADOWS ================= -->
  <a-entity id="world" shadow-all>

    <!-- sand island -->
    <a-cylinder position="0 -0.28 0" radius="18" height="0.6" segments-radial="64"
                material="color: #ffffff" tex="type: sand; repeat: 14 1"></a-cylinder>
    <a-ring position="0 0.03 0" rotation="-90 0 0" radius-inner="16" radius-outer="18" segments-theta="64"
            material="color: #c9b27a; opacity: 0.55; transparent: true"></a-ring>
    <a-torus position="0 0.05 0" rotation="90 0 0" radius="18.1" radius-tubular="0.12" segments-tubular="96"
             material="color: #ffffff; opacity: 0.6; transparent: true"
             animation="property: scale; to: 1.025 1.025 1.025; dir: alternate; dur: 2600; loop: true; easing: easeInOutSine"></a-torus>

    <!-- boardwalk, torches, bushes, rocks -->
    <a-entity garden></a-entity>

    <!-- torch lights near the cabana -->
    <a-entity class="nl" data-day="0.1" data-night="1.2" light="type: point; color: #ff9a3c; intensity: 0.1; distance: 9" position="-1.5 2 7"></a-entity>
    <a-entity class="nl" data-day="0.1" data-night="1.2" light="type: point; color: #ff9a3c; intensity: 0.1; distance: 9" position="1.5 2 7"></a-entity>

    <!-- palm trees -->
    <a-entity palm position="-9 0 5"></a-entity>
    <a-entity palm position="10 0 3" rotation="0 90 0"></a-entity>
    <a-entity palm position="-12 0 -5" rotation="0 40 0"></a-entity>
    <a-entity palm position="13 0 -8" rotation="0 200 0"></a-entity>
    <a-entity palm position="-6 0 -13" rotation="0 120 0"></a-entity>
    <a-entity palm position="7 0 -14" rotation="0 300 0"></a-entity>
    <a-entity palm position="-14 0 8" rotation="0 70 0"></a-entity>
    <a-entity palm position="14 0 9" rotation="0 160 0"></a-entity>

    <!-- surfboards leaning by the cabana -->
    <a-entity position="7 1.1 -1.5" rotation="0 -20 12">
      <a-sphere radius="1" scale="0.3 1.15 0.04" color="#ff5a5f"></a-sphere>
      <a-box position="0 0 0.045" width="0.12" height="2" depth="0.01" color="#ffffff"></a-box>
    </a-entity>
    <a-entity position="7.6 1.1 -0.6" rotation="0 -35 10">
      <a-sphere radius="1" scale="0.28 1.1 0.04" color="#ffd23f"></a-sphere>
      <a-box position="0 0 0.045" width="0.1" height="1.9" depth="0.01" color="#1982c4"></a-box>
    </a-entity>

    <!-- bouncing beach ball -->

  <!-- Camera: starts on the boardwalk, walk with W A S D -->
  <a-entity id="rig" position="0 0 13">

<script>
/* ---------- Day / Night switch (button or press N) ---------- */
(function () {
  let night = false;
  const q = s => document.querySelector(s);

  function setMode(n) {
    night = n;
    SKY.draw(n);
    q('a-scene').setAttribute('fog', 'color', n ? '#0b1233' : '#cfe8ff');
    q('#amb').setAttribute('light', { color: n ? '#8fa2ff' : '#ffffff', intensity: n ? 0.3 : 0.65 });
    q('#hemi').setAttribute('light', { intensity: n ? 0.15 : 0.3 });
    q('#sun').setAttribute('light', { color: n ? '#8aa3ff' : '#fff3d6', intensity: n ? 0.35 : 0.9 });
    q('#ocean').setAttribute('material', 'color', n ? '#2a3f7a' : '#ffffff');
    q('#sunball').setAttribute('visible', !n);
    q('#moonball').setAttribute('visible', n);
    q('#stars').setAttribute('visible', n);
    document.querySelectorAll('.nl').forEach(e => {
      e.setAttribute('light', 'intensity', parseFloat(n ? e.dataset.night : e.dataset.day));
    });
    document.querySelectorAll('.cloud').forEach(c => {
      c.setAttribute('material', 'color', n ? '#2b3558' : '#ffffff');
    });
    q('#mode').innerHTML = n ? '&#9728;&#65039; Day' : '&#127769; Night';
  }

  const start = () => {
    q('#mode').addEventListener('click', () => setMode(!night));
    window.addEventListener('keydown', e => { if (e.key === 'n' || e.key === 'N') setMode(!night); });
  };
  const scene = q('a-scene');
  if (scene.hasLoaded) start(); else scene.addEventListener('loaded', start);
})();
</script>
